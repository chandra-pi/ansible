- name: conditions in ansible
  hosts: local
  connection: local
  vars:
    NUMBER: 122
  tasks:
  - name: print if the number is less than or equal to 100
    ansible.builtin.debug:
      msg: "number {{ NUMBER }} is less than 100"
    when: NUMBER < 100

  - name: print if the number is greater than or equal to 100
    ansible.builtin.debug:
      msg: "number {{ NUMBER }} is greater than 100"
    when: NUMBER > 100