- name: shell vs command modules
  hosts: frontend
  tasks:
  - name: redirect ls output to a file
    #ansible.builtin.command: "ls -ltr > /tmp/output_1.txt"
    ansible.builtin.shell: "ls -ltr > /tmp/output_1.txt"
    register: command_result
  
  - name: print the outcome
    ansible.builtin.debug:
      msg: "{{ command_result }}"

  - name: redirect ls output to a file using command
    ansible.builtin.command: "ls -ltr"
    #ansible.builtin.shell: "ls -ltr > /tmp/output_1.txt"
    register: command_output

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ command_output }}"